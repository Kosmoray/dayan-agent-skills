    <g transform="translate(668 470)"><rect width="258" height="218" rx="10" fill="#F7F5F0"/><text x="24" y="46" fill="#D7263D" font-size="20" font-weight="700" letter-spacing="3">RISKY RELEASE</text><text x="24" y="109" fill="#111827" font-size="42" font-weight="800">VERDICT</text><text x="24" y="158" fill="#526174" font-size="24">adversarial-reviewer</text><rect x="24" y="180" width="184" height="3" fill="#D7263D"/></g>
